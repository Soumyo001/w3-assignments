<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="Eagle Creek Golf Club, Stay and Play — a championship-level course in Orlando, FL. Book your stay and tee time."/>
        <title>Eagle Creek Golf Club - Stay&amp;Play</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <header>
            <div class="brand-logo">
                <a href="#" class="brand-logo__link">
                    <img
                        src="assets/icons-white/brand-logo.svg"
                        alt="Brand Logo"
                        width="32"
                        height="32"
                    />
                    <span class="brand-logo__name">
                      Stay
                      <span class="brand-logo__amp">&amp;</span>
                      Play
                    </span>
                </a>
            </div>
            <nav class="nav-bar">
                <ul class="nav-bar__list">
                    <li><a href="#" class="nav-bar__link">Home</a></li>
                    <li><a href="#" class="nav-bar__link">Where to stay</a></li>
                    <li><a href="#" class="nav-bar__link">Where to play</a></li>
                    <li><a href="#" class="nav-bar__link">Group Travel</a></li>
                </ul>
            </nav>
            <button type="button" class="header-btn">
                <img src="assets/icons-white/play-golf.svg" alt="" width="20" height="20" class="header-btn__icon"/>
                <span class="header-btn__text">Book a tee time</span>
            </button>
            <div class="search-bar">
                <img src="assets/icons-white/search.svg" alt="search icon" class="search-bar__icon"/>
                <input type="text" placeholder="search" class="search-bar__input"/>
            </div>
            <button type="button" class="nav-btn">
                <img src="assets/icons-white/menu.svg" alt="" width="24" height="24">
            </button>
        </header>
    </body>
</html>
